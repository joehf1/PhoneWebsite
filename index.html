  if (unlocking) return; unlocking = true;
  var el = $('lockRoot'); el.style.transform = 'translateY(-105%)'; el.style.opacity = '0';
  setTimeout(function(){ unlocking = false; go('home'); S.fromLock = true; $('view').innerHTML = V.home(); startPushes(); }, 320);
}

var closing = false;
function goHome(){
  if (S.screen === 'lock' || S.screen === 'home' || closing) return;
  closing = true; S.alert = null; renderAlert();
  var v = $('view'), l = $('layer');
  v.style.animation = 'none'; l.style.animation = 'none';
  v.style.transformOrigin = S.origin; l.style.transformOrigin = S.originL;
  void v.offsetWidth;
  v.classList.add('closing'); l.classList.add('closing');
  setTimeout(function(){ closing = false; l.classList.remove('closing'); go('home'); }, 230);
}

/* ====== actions ====== */
var OPEN_APPS = ['wa','photos','phone'];
var A = {
  home: goHome,
  banner: function(el){
    if (el.dataset.swiped) return;
    var id = el.getAttribute('data-id'); hideBanner();
    var row = document.createElement('div'); row.setAttribute('data-id', id);
    S.origin = '50% 0%'; S.originL = '50% 6%';
    var wasApp = IN_APP(S.screen);
    if (!wasApp) { S.screen = 'home'; }
    A.chat(row);
  },
  smsBanner: function(el){
    if (el.dataset.swiped) return;
    hideBanner(); S.alert = lastSms; renderAlert();
  },
  unlock: unlock,
  torch: function(){ S.torch = !S.torch; render(); },
  lockNotif: function(){ S.alert = 'افتح الجوال أول — اسحب لفوق'; renderAlert(); },
  closeAlert: function(){ S.alert = null; renderAlert(); },
  soon: function(){ S.alert = 'هالخاصية تفتح يوم الجمعة البيضاء 😉'; renderAlert(); },
  open: function(el){
    var s = el.getAttribute('data-s');
    if (OPEN_APPS.indexOf(s) === -1) return A.soon();
    originFrom(el);
    go(s, s === 'files' ? { code:'', codeErr:false, face:'scan' } : s === 'wa' ? { waTab:'chats' } : null);
  },
  back: function(el){ go(el.getAttribute('data-s')); },
  archive: function(){ go('archive'); },
  waFilter: function(el){ S.waFilter = el.getAttribute('data-id'); var l = $('waList'); if (l) { l.innerHTML = waListHtml(); l.classList.add('quiet'); } document.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('on', c.getAttribute('data-id') === S.waFilter); }); },
  waTab: function(el){ var t = el.getAttribute('data-id'); if (t === S.waTab) return; S.waTab = t; S.anim = 'fade'; render(); },
  locked: function(){ S.alert = 'ما تقدر ترسل أو تعدّل من جوال غيرك 😅'; renderAlert(); },
  status: function(el){
    var c = chatById(el.getAttribute('data-id'));
    var text = { snap:'الليلة لايف… فيه مفاجأة 👀', billionaire:'Mars soon 🚀', khala:'صباح الخير 🌸' }[c.id] || '';
    var o = $('overlay'); o.hidden = false;
    o.innerHTML = '<button data-a="closeStatus" aria-label="إغلاق" style="position:absolute;inset:0;background:#0b0b0b;display:flex;flex-direction:column;animation:lpFade .2s ease-out backwards;text-align:center"><div style="margin:58px 12px 0;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden"><div style="height:100%;background:#fff;transform-origin:right;animation:lpBar 4s linear forwards"></div></div><div style="display:flex;align-items:center;gap:10px;padding:12px 14px">'+avatar(c,34)+'<span style="font-size:14px;font-weight:700">'+esc(c.name)+'</span></div><div style="flex:1;display:flex;align-items:center;justify-content:center;padding:30px;font-size:26px;font-weight:700;line-height:1.5">'+esc(text)+'</div></button>';
    clearTimeout(A._st); A._st = setTimeout(function(){ A.closeStatus(); }, 4000);
  },
  closeStatus: function(){ clearTimeout(A._st); var o = $('overlay'); if (!S.alert) { o.hidden = true; o.innerHTML = ''; } },
  camMode: function(el){ S.camMode = el.getAttribute('data-id'); S.anim = 'none'; render(); },
  shutter: function(){
    var vf = $('viewfinder'); if (!vf) return;
    var f = document.createElement('div'); f.style.cssText = 'position:absolute;inset:0;background:#fff;animation:lpFlash .35s ease-out forwards;pointer-events:none'; vf.appendChild(f);
    setTimeout(function(){ if (f.parentNode) f.parentNode.removeChild(f); }, 400);
    S.shots++; setTimeout(function(){ if (S.screen === 'camera') { S.anim = 'none'; render(); } }, 380);
  },
  camFlip: function(){ var ic = $('flipIc'); if (ic) { ic.style.animation = 'none'; void ic.offsetWidth; ic.style.animation = 'lpSpin .4s ease'; } var vf = $('viewfinder'); if (vf) { vf.style.transition = 'filter .2s'; vf.style.filter = 'blur(12px)'; setTimeout(function(){ vf.style.filter = 'none'; }, 260); } },
  camRoll: function(){ go('photos'); },
  chat: function(el){
    var id = el.getAttribute('data-id'), c = chatById(id);
    var first = !S.read[id]; S.read[id] = true;
    go('chat', { chatId:id, typing: !!(c.typing && first) });
    if (c.typing && first) setTimeout(function(){ if (S.screen === 'chat' && S.chatId === id) { S.typing = false; var sub = $('chatSub'); if (sub) { sub.textContent = c.sub; sub.style.color = 'rgba(235,235,245,.6)'; } var dl = document.querySelectorAll('.bub'); var last = dl[dl.length-1]; if (last && last.querySelector('span[style*="lpDot"]')) last.remove(); } }, 3200);
  },
  calls: function(el){ S.calls = el.getAttribute('data-id'); S.anim = 'none'; render(); },
  note: function(el){ go('note', { noteIdx: +el.getAttribute('data-id') }); },
  day: function(el){ S.day = +el.getAttribute('data-id'); S.anim = 'none'; render(); },
  photo: function(el){ go('photo', { photoIdx: +el.getAttribute('data-id') }); },
  photoNav: function(el){ var n = S.photoIdx + (+el.getAttribute('data-id')); if (n < 0 || n >= PHOTOS.length) return; S.photoIdx = n; S.anim = 'fade'; render(); },
  secret: function(){
    if (S.solved) return go('reveal');
    go('face', { face:'scan' });
    setTimeout(function(){ if (S.screen === 'face') { S.face = 'fail'; S.anim = 'none'; render(); } }, 1100);
  },
  toPass: function(){ go('pass', { code:'', codeErr:false, shake:0 }); },
  key: function(el){
    if (S.code.length >= 4) return;
    S.code += el.getAttribute('data-id'); S.codeErr = false; S.shake = 0; S.anim = 'none'; render();
    if (S.code.length === 4) setTimeout(function(){
      if (S.code === CONFIG.passcode) { S.solved = true; try { localStorage.setItem('thnyan_lp_solved','1'); } catch(e){} go('reveal', { code:'' }); }
      else { S.code = ''; S.codeErr = true; S.shake = 1; S.anim = 'none'; render(); }
    }, 300);
  },
  passBack: function(){ if (S.code.length) { S.code = S.code.slice(0,-1); S.anim = 'none'; render(); } else go('files'); },
  share: function(){
    var data = { title:'جوال عبدالله', text:'لقيت جوال عبدالله وفتحت ملف «الجمعة» 👀 تقدر تفتحه؟', url: location.href };
    if (navigator.share) navigator.share(data).catch(function(){});
    else if (navigator.clipboard) navigator.clipboard.writeText(data.text + ' ' + data.url).then(function(){ S.alert = 'انسخ الرابط وأرسله لربعك ✓'; renderAlert(); });
  }
};

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-a]');
  if (!el || !$('screen').contains(el)) return;
  var fn = A[el.getAttribute('data-a')];
  if (fn) fn(el, e);
});
document.addEventListener('input', function(e){
  if (e.target && e.target.id === 'waSearch') { S.waQuery = e.target.value; var l = $('waList'); if (l) { l.innerHTML = waListHtml(); l.classList.add('quiet'); } }
});
document.addEventListener('keydown', function(e){
  if (S.screen === 'pass' && /^[0-9]$/.test(e.key)) { var b = document.querySelector('[data-a="key"][data-id="'+e.key+'"]'); if (b) A.key(b); }
  else if (S.screen === 'pass' && e.key === 'Backspace') A.passBack();
  else if (e.key === 'Escape') { if (S.alert) A.closeAlert(); else goHome(); }
});

/* ====== fit to window ====== */
function isPhone(){
  var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  return window.innerWidth <= 600 || (coarse && Math.min(window.innerWidth, window.innerHeight) <= 600);
}
function fit(){
  var m = isPhone();
  document.documentElement.classList.toggle('mobile', m);
  if (m) { $('device').style.transform = 'none'; return; }
  var k = Math.min(window.innerWidth / 440, window.innerHeight / 912, 1.15);
  $('device').style.transform = 'scale(' + k + ')';
}
window.addEventListener('resize', fit); fit();

/* ====== tick ====== */
setInterval(function(){
  var c = $('lockClock'); if (c) c.textContent = timeStr();
  if (S.screen !== 'lock') $('sbTime').textContent = timeStr();
  if (S.screen === 'reveal') { var cds = document.querySelectorAll('#cdRow .cd'); countdown().forEach(function(x,i){ if (cds[i]) cds[i].textContent = AR(x[0]); }); }
}, 15000);

render();
})();
</script>
</body>
