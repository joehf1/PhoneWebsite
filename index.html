.rcpt{margin:-2px 2px 4px;font-size:11px;line-height:13px;letter-spacing:.06px;color:#8d8d93;align-self:flex-end}

.typing-dots{display:flex;gap:4px;padding:12px 14px}

.bvoice{display:flex;align-items:center;gap:9px;width:210px;padding:2px 0;direction:ltr}
.bvoice .vplay{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center}

.kcompose{flex-shrink:0;padding:8px 16px 38px;background:#000}
.kfield{width:100%;display:flex;align-items:center;gap:4px;padding:4px 4px 4px 12px;padding-right:12px;border-radius:18px;border:1px solid rgba(84,84,88,.65);background:#000;color:#8d8d93;font-size:17px;line-height:22px;letter-spacing:-.41px;text-align:right}

.kfaceid{width:156px;height:158px;border-radius:8px;background:rgba(30,30,30,.75);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:lpCard .26s cubic-bezier(.2,.9,.3,1.2) backwards}
.kfaceid > span{display:flex}

/* passcode */

/* lock screen */

.kl-lock{display:flex;margin-top:6px}
html.mobile .kl-date{font-size:16px}

.wthread{padding:8px 16px 10px;display:flex;flex-direction:column;gap:2px}

/* Dynamic Island (replaces the kit notch) */
.status{height:54px}
.island{top:11px;width:126px;height:37px;border-radius:19px;background:#000}
.status > #sbTime{margin-left:calc(16.67% - 32px)}
.status .ksb-r{margin-right:calc(16.67% - 44px)}
.kban,.callnote{top:11px}
/* Phone (Recents) — DetailedTableView-smallCell spacing */
.plist{border-top:.5px solid rgba(84,84,88,.65);margin-top:4px}
.prow{padding-right:16px}
.prow-c{display:flex;align-items:stretch;border-bottom:.5px solid rgba(84,84,88,.65)}
.prow-l{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:8px 0 9px 16px}
.prow-n{font-size:17px;line-height:22px;letter-spacing:-.41px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow-n.miss{color:#ff453a}

.prow-r{display:flex;align-items:center;gap:10px;padding-left:16px}
.prow-t{font-size:15px;line-height:20px;letter-spacing:-.24px;color:#8d8d93;white-space:nowrap}
/* TabBar — kit inactive color, 49px tabs */
.ktabbar{height:83px}
.ktab{height:49px;color:#8d8d93;gap:3px}
.ktab svg{height:24px}
.ktabbar-5 .ktab{white-space:nowrap}
/* passcode keys — kit _Phone-key */
.kkey{background:#333}
.kkey-n{font-size:37px;line-height:41px;letter-spacing:.37px}
.kkey-l{font-size:10px;font-weight:700;letter-spacing:2.8px;margin-top:0}

/* Dynamic Island: banners and calls grow out of the island and shrink back into it */
@keyframes lpIsleIn{0%{clip-path:inset(0 calc(50% - 63px) calc(100% - 37px) calc(50% - 63px) round 19px)}100%{clip-path:inset(0 0 0 0 round 30px)}}
@keyframes lpIsleOut{0%{clip-path:inset(0 0 0 0 round 30px)}100%{clip-path:inset(0 calc(50% - 63px) calc(100% - 37px) calc(50% - 63px) round 19px)}}
.kban{transform:translateX(-50%);transition:none;background:#000;border-radius:30px;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;clip-path:inset(0 calc(50% - 63px) calc(100% - 37px) calc(50% - 63px) round 19px)}
.kban.show{transform:translateX(-50%);animation:lpIsleIn .55s cubic-bezier(.2,1.15,.3,1) forwards}
.kban.hide{animation:lpIsleOut .38s cubic-bezier(.5,0,.3,1) forwards}
.kban > *{opacity:0;filter:blur(4px);transition:opacity .2s ease,filter .2s ease}
.kban.show > *{opacity:1;filter:none;transition:opacity .3s ease .18s,filter .3s ease .18s}
.kban.hide > *{opacity:0;filter:blur(4px);transition:opacity .12s ease,filter .12s ease}
.callnote{animation:lpIsleIn .55s cubic-bezier(.2,1.15,.3,1) both;transition:none}
.callnote > *{animation:lpFade .3s ease .18s backwards}
.callnote.ring{background:#000;border-radius:30px;-webkit-backdrop-filter:none;backdrop-filter:none}
.callnote.live{border-radius:30px}
.callnote.out{transform:translateX(-50%);opacity:1;animation:lpIsleOut .38s cubic-bezier(.5,0,.3,1) forwards}

/* ====== iOS 27 UI kit (Apple Design Resources) ====== */
/* status bar 62pt: time centred in the left half, island 125x37, levels centred in the right half */
.status{height:62px;padding:3px 8px 0;display:flex;align-items:center;justify-content:center}

.sb-bars i{display:block;width:3.333px;border-radius:4px;background:#fff}
html.mobile .status{height:calc(env(safe-area-inset-top, 0px) + 12px);padding:0}

.gbtn,.gtabs,.kdock,.ksearch-pill,.gsearch,.kl-btn{background:rgba(48,48,52,.5);-webkit-backdrop-filter:blur(14px) saturate(1.7);backdrop-filter:blur(14px) saturate(1.7);box-shadow:1.25px 0 0 -.75px rgba(255,255,255,.45),-1.25px 0 0 -.75px rgba(255,255,255,.45),0 0 0 .5px rgba(255,255,255,.16),inset 0 .5px 0 rgba(255,255,255,.22),0 8px 15px rgba(0,0,0,.22)}
.gbtn.ggreen{background:#25d366}
.gbtn.gon{background:#0091ff}
/* top toolbar: 44pt glass buttons, 16pt margins */
.gtop{height:auto;min-height:44px;padding:0 16px 10px;margin-top:0}
.gbtn{height:44px;min-width:44px;border-radius:296px;font-weight:600}
.gbtn.gpill{padding:0 14px}

/* tab bar: 62pt pill (54pt tabs + 4pt glass inset), 25pt from the edges, separate search circle */
.gtabbar{padding:16px 25px 25px;gap:12px}
.gtabs{height:62px;padding:4px;border-radius:1000px}
.gtab{height:54px;border-radius:100px;gap:1px;font-size:10px;line-height:12px;font-weight:600}

.gbtn-lg{height:62px;min-width:62px;border-radius:1000px}
/* home screen: 64pt icons, 30pt margins, 17.33pt rows, 12pt labels */
.khome .grid{grid-template-columns:repeat(4,64px);justify-content:space-between;column-gap:0;row-gap:17.33px;padding:28px 30px 0}
.app{gap:5px;font-size:12px;line-height:14px;font-weight:500}
.app > span{max-width:82px;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 25px #000}
.kwidget{gap:5px;font-size:12px;line-height:14px;font-weight:500;text-shadow:0 2px 25px #000}
.kw-notes,.kw-cal{width:100%;height:auto;aspect-ratio:1;border-radius:26px}
.kw-cal-d{font-size:80px;line-height:84px}
/* App Icon Template 27: continuous-corner squircle with a light glass edge */
.ic{width:64px;height:64px;border-radius:22.5%;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 0 .5px rgba(255,255,255,.22),inset 0 -1px 2px rgba(0,0,0,.12)}

.kn-h{gap:10px}
.kn-t{font-size:15px;line-height:17px;font-weight:600;letter-spacing:-.23px}
.kn-d{font-size:15px;line-height:18px;letter-spacing:-.23px}
.kn-time{font-size:15px;line-height:17px;letter-spacing:0;color:#525252}
.kl-notes{padding:0 8px}
.kban{width:386px;max-width:calc(100% - 16px);border-radius:24px}
@keyframes lpIsleIn{0%{clip-path:inset(0 calc(50% - 63px) calc(100% - 37px) calc(50% - 63px) round 19px)}100%{clip-path:inset(0 0 0 0 round 24px)}}
@keyframes lpIsleOut{0%{clip-path:inset(0 0 0 0 round 24px)}100%{clip-path:inset(0 calc(50% - 63px) calc(100% - 37px) calc(50% - 63px) round 19px)}}
@keyframes lpIsleGlass{0%,35%{background-color:#000}100%{background-color:rgba(18,18,20,.5)}}
@keyframes lpIsleBlack{0%{background-color:rgba(18,18,20,.5)}55%,100%{background-color:#000}}
.kban{background:rgba(18,18,20,.5)}
.kban.show{box-shadow:1.25px 0 0 -.75px rgba(255,255,255,.4),-1.25px 0 0 -.75px rgba(255,255,255,.4),0 0 0 .5px rgba(255,255,255,.16),0 8px 15px rgba(0,0,0,.18)}

/* banners and calls start exactly on the island: 3pt status padding + 11pt = 14pt from the top */
.kban,.callnote{top:14px}
@keyframes lpIsleIn{0%{clip-path:inset(0 calc(50% - 62.5px) calc(100% - 37px) calc(50% - 62.5px) round 18.5px)}100%{clip-path:inset(0 0 0 0 round 24px)}}
@keyframes lpIsleOut{0%{clip-path:inset(0 0 0 0 round 24px)}100%{clip-path:inset(0 calc(50% - 62.5px) calc(100% - 37px) calc(50% - 62.5px) round 18.5px)}}
.kban{clip-path:inset(0 calc(50% - 62.5px) calc(100% - 37px) calc(50% - 62.5px) round 18.5px)}

/* phone layout: keep our island (sits on top of a real Dynamic Island) so banners visibly grow out of it */
html.mobile .island{display:block;position:fixed;z-index:7;left:50%;top:11px;margin:0;transform:translateX(-50%);width:125px;height:37px}
html.mobile .kban,html.mobile .callnote{top:11px}
html.mobile .status > .island{visibility:visible}

  if (!el || (S.screen !== 'home' && S.screen !== 'lock')) return;
  var host = $('screen').getBoundingClientRect(), b = el.getBoundingClientRect();
  var k = host.width / 402, cx = b.left + b.width/2 - host.left, cy = b.top + b.height/2 - host.top;

function bindLock(){
  var el = $('lockRoot'), y0 = null, d = 0, tr = el.style.transition;
  el.addEventListener('pointerdown', function(e){ y0 = e.clientY; d = 0; });
  el.addEventListener('pointermove', function(e){
    if (y0 == null || unlocking) return;
    d = Math.max(0, y0 - e.clientY);
    if (d < 4) return;
    el.style.transition = 'none';
    el.style.transform = 'translateY(' + (-d) + 'px)';
    el.style.opacity = String(1 - Math.min(d / 500, .5));
  });
  var end = function(){
    if (y0 == null) return; y0 = null;
    el.style.transition = tr;

/* swipe up on the home bar to go home, the app follows the finger */
function bindHomebar(){
  var hb = $('homebar'), y0 = null, dy = 0, dragging = false;
  var els = function(){ return [$('view'), $('layer')]; };
  var clear = function(x){ x.style.transition = ''; x.style.transform = ''; x.style.opacity = ''; x.style.borderRadius = ''; };
  hb.addEventListener('pointerdown', function(e){
    if (!IN_APP(S.screen) || closing) return;
    y0 = e.clientY; dy = 0; dragging = false;
    try { hb.setPointerCapture(e.pointerId); } catch(err){}
  });
  hb.addEventListener('pointermove', function(e){
    if (y0 == null) return;
    dy = Math.max(0, y0 - e.clientY);
    if (dy > 4) dragging = true;
    if (!dragging) return;
    var p = Math.min(dy, 320) / 320, t = 'translateY(' + (-dy * .55) + 'px) scale(' + (1 - p * .38) + ')';
    els().forEach(function(x){ x.style.animation = 'none'; x.style.transition = 'none'; x.style.transform = t; x.style.borderRadius = Math.round(p * 44) + 'px'; });
  });
  var end = function(){

    hb.dataset.swiped = '1'; setTimeout(function(){ delete hb.dataset.swiped; }, 350);

}

function liveStep(firstWait){
  var m = CEO_LIVE[live.i];
  if (!m) { live.state = 'done'; return; }
  live.timer = setTimeout(function(){
    if (!liveViewing()) { live.state = 'paused'; return; }

  if (!el || !$('screen').contains(el)) return;
  var fn = A[el.getAttribute('data-a')];
  if (fn) fn(el, e);
});
document.addEventListener('input', function(e){
  if (e.target && e.target.id === 'waSearch') { S.waQuery = e.target.value; var l = $('waList'); if (l) { l.innerHTML = waListHtml(); l.classList.add('quiet'); } }
});
document.addEventListener('keydown', function(e){
  if (S.screen === 'pass' && /^[0-9]$/.test(e.key)) { var b = document.querySelector('[data-a="key"][data-id="'+e.key+'"]'); if (b) A.key(b); }
  else if (S.screen === 'pass' && e.key === 'Backspace') A.passBack();
  else if (e.key === 'Escape') { if (S.alert) A.closeAlert(); else goHome(); }
});

/* ====== fit to window ====== */
function isPhone(){
  var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  return window.innerWidth <= 600 || (coarse && Math.min(window.innerWidth, window.innerHeight) <= 600);
}
function fit(){
  var m = isPhone();
  document.documentElement.classList.toggle('mobile', m);
  if (m) { $('device').style.transform = 'none'; return; }
  var k = Math.min(window.innerWidth / 440, window.innerHeight / 912, 1.15);
  $('device').style.transform = 'scale(' + k + ')';
}
window.addEventListener('resize', fit); fit();
bindHomebar();

/* ====== tick ====== */
setInterval(function(){
  var c = $('lockClock'); if (c) c.textContent = timeStr();
  if (S.screen !== 'lock') $('sbTime').textContent = timeStr();
  if (S.screen === 'reveal') { var cds = document.querySelectorAll('#cdRow .cd'); countdown().forEach(function(x,i){ if (cds[i]) cds[i].textContent = AR(x[0]); }); }
}, 15000);

render();
})();
</script>
</body>
</html>
