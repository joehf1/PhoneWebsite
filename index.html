function waListHtml(){
  var q = (S.waQuery || '').trim();
  var list = CHATS.filter(function(c){ return !c.archived; }).filter(function(c){
    var un = S.read[c.id] ? 0 : c.unread;
    if (S.waFilter === 'unread' && !un) return false;
    if (S.waFilter === 'groups' && !c.group) return false;
    if (q && (c.name + ' ' + preview(c)).indexOf(q) === -1) return false;
    return true;
  });
  var pinned = list.filter(function(c){ return c.pinned; }), rest = list.filter(function(c){ return !c.pinned; });
  var rows = pinned.concat(rest).map(chatRow).join('');
  if (!rows) rows = '<p class="muted" style="text-align:center;font-size:13px;margin:40px 20px">'+(q ? 'ما فيه نتائج لـ «'+esc(q)+'»' : 'ما فيه دردشات هنا')+'</p>';
  var arch = CHATS.filter(function(c){ return c.archived; }).length;
  var archRow = (S.waFilter === 'all' && !q) ? '<button class="tap" data-a="archive" style="width:100%;display:flex;align-items:center;gap:14px;padding:10px 26px;font-size:14px;border-bottom:.5px solid #262626;text-align:right"><svg width="18" height="16" viewBox="0 0 16 14" aria-hidden="true"><rect x="1" y="1" width="14" height="4" rx="1" fill="none" stroke="rgba(235,235,245,.75)" stroke-width="1.3"/><path d="M2.5 5v7h11V5M6 8h4" fill="none" stroke="rgba(235,235,245,.75)" stroke-width="1.3"/></svg><span style="flex:1">دردشات مؤرشفة</span><span class="muted" style="font-size:13px">'+AR(arch)+'</span></button>' : '';

    + '<div class="scroll">'+rows+'</div></div>';

V.chat = function(){
  var c = chatById(S.chatId);

    + avatar(c,36)
    + '<div style="flex:1;min-width:0"><p style="margin:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(c.name)+'</p><p id="chatSub" style="margin:0;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:'+(typing?'#21c063':'rgba(235,235,245,.6)')+'">'+(typing?'يكتب…':esc(c.sub))+'</p></div></div>'
    + '<div class="scroll" style="display:flex;flex-direction:column-reverse"><div id="chatInner" style="padding:10px 10px 12px;display:flex;flex-direction:column;gap:3px">'
    + '<p style="margin:0 auto 8px;max-width:300px;padding:6px 10px;border-radius:8px;background:#182229;color:#ffd279;font-size:11px;line-height:1.5;text-align:center">الرسائل والمكالمات مشفرة تمامًا بين الطرفين.</p>'

V.safari = function(){
  return '<div style="flex:1;min-height:0;display:flex;flex-direction:column;background:#000"><div class="scroll" style="padding:30px 22px 10px"><p style="margin:0;font-size:20px;font-weight:700;text-align:center">لا يمكن فتح الصفحة</p><p class="muted" style="margin:8px 0 26px;font-size:13.5px;line-height:1.6;text-align:center">لا يمكن لـ Safari فتح الصفحة لأن الاتصال بالإنترنت ضعيف.</p><p style="margin:0 0 8px;font-size:17px;font-weight:700">السجل</p><div class="card">'
    + HISTORY.map(function(h,i){ return '<div class="rise" style="animation-delay:'+(60+i*40)+'ms;padding:10px 14px;border-bottom:.5px solid #2c2c2e;font-size:13.5px">'+esc(h)+'</div>'; }).join('')
    + '</div></div><div style="flex-shrink:0;padding:8px 14px 34px;background:#121212"><div class="muted" style="height:40px;border-radius:12px;background:#2c2c2e;display:flex;align-items:center;justify-content:center;font-size:13.5px">بحث أو إدخال موقع</div></div></div>';
};

V.camera = function(){
  var modes = [['video','فيديو'],['photo','صورة'],['portrait','بورتريه'],['pano','بانوراما']];
  var thumb = S.shots ? 'background:linear-gradient(135deg,#6a5236,#1e160c);border:1.5px solid #fff' : 'background:#2c2c2e';
  var isVideo = S.camMode === 'video';
  return '<div style="flex:1;min-height:0;display:flex;flex-direction:column;background:#000;position:relative">'
    + '<div id="viewfinder" style="position:relative;flex:1;margin-top:30px;background:radial-gradient(circle at 50% 45%,#1f1a14,#050403 70%);display:flex;align-items:center;justify-content:center;font-size:12px;color:rgba(255,255,255,.35);overflow:hidden'+(S.camMode==='portrait'?';box-shadow:inset 0 0 120px 40px rgba(0,0,0,.9)':'')+'">'
    + '<span>'+(S.camMode==='pano'?'حرّك الجوال ببطء ←':'الكاميرا مغطاة')+'</span>'
    + (S.camMode==='portrait'?'<span style="position:absolute;top:14px;padding:3px 10px;border-radius:6px;background:#ffd60a;color:#000;font-size:11px;font-weight:700">ضوء طبيعي</span>':'')
    + '</div>'
    + '<div style="display:flex;justify-content:center;gap:6px;padding:10px 0;font-size:12px">'+modes.map(function(m){ return '<button data-a="camMode" data-id="'+m[0]+'" style="padding:6px 10px;border-radius:14px;transition:color .2s,background .2s;color:'+(S.camMode===m[0]?'#ffd60a':'rgba(255,255,255,.7)')+';font-weight:'+(S.camMode===m[0]?700:400)+';background:'+(S.camMode===m[0]?'rgba(255,255,255,.08)':'transparent')+'">'+m[1]+'</button>'; }).join('')+'</div>'
    + '<div style="display:flex;align-items:center;justify-content:space-around;padding:4px 30px 40px">'
    + '<button class="press" data-a="camRoll" aria-label="آخر صورة" style="width:44px;height:44px;border-radius:8px;'+thumb+'"></button>'
    + '<button class="press" data-a="shutter" aria-label="'+(isVideo?'تسجيل':'التقاط')+'" style="width:70px;height:70px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center"><span style="width:56px;height:56px;border-radius:50%;background:'+(isVideo?'#ff3b30':'#fff')+';transition:background .2s"></span></button>'
    + '<button class="press" data-a="camFlip" aria-label="تبديل الكاميرا" style="width:44px;height:44px;border-radius:50%;background:#2c2c2e;display:flex;align-items:center;justify-content:center"><svg id="flipIc" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9a8 8 0 0 1 14-3l2-2v6h-6l2.3-2.3A5.5 5.5 0 0 0 6.6 9.5M20 15a8 8 0 0 1-14 3l-2 2v-6h6l-2.3 2.3a5.5 5.5 0 0 0 9.7-1.8" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></button>'
    + '</div></div>';
};

/* ====== render ====== */
var IN_APP = function(s){ return s !== 'lock' && s !== 'home'; };

function render(prev){
  var view = $('view'), layer = $('layer');
  view.className = S.anim === 'none' ? 'view quiet' : 'view';
  view.innerHTML = V[S.screen]();
  view.style.animation = ANIM[S.anim] || 'none';
  view.style.transformOrigin = S.origin;
  var inApp = IN_APP(S.screen);
  if (inApp && layer.hidden) { layer.hidden = false; layer.className = 'layer'; layer.style.transformOrigin = S.originL; layer.style.animation = S.anim === 'app' ? ANIM.app : ANIM.fade; }
  if (!inApp) layer.hidden = true;
  $('homebar').hidden = S.screen === 'lock';
  $('sbTime').textContent = S.screen === 'lock' ? '' : timeStr();
  renderAlert();
  if (S.screen === 'lock') bindLock();
}

function renderAlert(){
  var o = $('overlay');
  if (!S.alert) { o.hidden = true; o.innerHTML = ''; return; }
  o.hidden = false;
  o.innerHTML = '<div style="position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;animation:lpFade .2s ease-out backwards"><div role="alertdialog" aria-modal="true" style="animation:lpCard .22s cubic-bezier(.2,.9,.3,1.2) backwards;width:270px;border-radius:14px;background:rgba(48,44,40,.97);overflow:hidden;text-align:center"><p style="margin:0;padding:18px 16px 16px;font-size:15px;font-weight:600;line-height:1.5">'+esc(S.alert)+'</p><button data-a="closeAlert" style="width:100%;height:44px;border-top:.5px solid rgba(255,255,255,.15);color:#0a84ff;font-size:16px;font-weight:600;text-align:center">حسناً</button></div></div>';
}

function bindLock(){
  var el = $('lockRoot'), y0 = null;
  el.addEventListener('pointerdown', function(e){ y0 = e.clientY; });
  el.addEventListener('pointerup', function(e){ if (y0 != null && y0 - e.clientY > 70) unlock(); y0 = null; });
}

var pushTimers = [], bannerTimer = null, pushesStarted = false;
function nowTime(){ var d = new Date(), h = d.getHours(); return (h%12||12)+':'+String(d.getMinutes()).padStart(2,'0')+' '+(h<12?'ص':'م'); }
function startPushes(){
  if (pushesStarted) return; pushesStarted = true;
  PUSHES.forEach(function(p){ pushTimers.push(setTimeout(function(){ deliver(p); }, p.after)); });
}
function deliver(p){
  var c = chatById(p.chat); if (!c) return;
  var t = nowTime(), texts = p.texts || [p.text];
  var lastDay = null; for (var k = c.msgs.length - 1; k >= 0; k--) if (c.msgs[k].day) { lastDay = c.msgs[k].day; break; }
  if (lastDay !== 'اليوم') c.msgs.push(D('اليوم'));
  texts.forEach(function(tx){ c.msgs.push(M(p.from, tx, t)); });
  c.when = t;
  var viewing = S.screen === 'chat' && S.chatId === c.id;
  if (viewing) {
    var inner = $('chatInner');
    if (inner) {
      var html = texts.map(function(tx, n){ return '<div class="bub" style="align-self:flex-start;margin-top:'+(n?0:6)+'px;background:#202c33;animation-delay:'+(n*180)+'ms">'+(c.group && !n ? '<p style="margin:0 0 1px;font-size:12px;font-weight:700;color:#53bdeb">'+esc(p.from)+'</p>' : '')+'<span class="t" style="white-space:pre-line">'+esc(tx)+'</span><span class="tm">'+t+'</span></div>'; }).join('');
      var dots = inner.querySelector('.typing-dots');
      if (dots) dots.insertAdjacentHTML('beforebegin', html); else inner.insertAdjacentHTML('beforeend', html);
    }
    return;
  }
  if (S.read[c.id]) { S.read[c.id] = false; c.unread = texts.length; } else { c.unread += texts.length; }
  if (S.screen === 'home' || S.screen === 'wa' || S.screen === 'archive') { S.anim = 'none'; render(); }
  showBanner(c, { from: p.from, text: texts.join(' · ') });
}
function showBanner(c, p){
  var isl = $('island');
  clearTimeout(bannerTimer);
  var fill = function(){
    isl.innerHTML = '<button class="island-c" id="banner" data-a="banner" data-id="'+c.id+'" aria-label="'+esc(c.name)+': '+esc(p.text)+'">'
      + '<div style="position:relative">'+avatar(c,44)+'<span style="position:absolute;left:-2px;bottom:-2px;width:16px;height:16px;border-radius:50%;background:#25d366;border:2px solid #000"></span></div>'
      + '<div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px"><span style="font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(c.name)+'</span><span style="font-size:11px;color:rgba(235,235,245,.55);flex-shrink:0">الآن</span></div>'
      + '<p style="margin:2px 0 0;font-size:12.5px;line-height:1.4;color:rgba(255,255,255,.9);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">'+(c.group?esc(p.from.split(' |')[0])+': ':'')+esc(p.text)+'</p></div></button>';
    isl.classList.remove('closing-i');
    void isl.offsetWidth;
    isl.classList.add('open');
    var b = $('banner'), y0 = null;
    requestAnimationFrame(function(){ b.classList.add('show'); });
    b.addEventListener('pointerdown', function(e){ y0 = e.clientY; });
    b.addEventListener('pointerup', function(e){ if (y0 != null && y0 - e.clientY > 20) { b.dataset.swiped = '1'; hideBanner(); } y0 = null; });
    bannerTimer = setTimeout(hideBanner, 5500);
  };
  if (isl.classList.contains('open')) { hideBanner(); setTimeout(fill, 420); } else fill();
}
function hideBanner(){
  var isl = $('island'), b = $('banner');
  clearTimeout(bannerTimer);
  if (!isl.classList.contains('open')) return;
  if (b) b.classList.remove('show');
  setTimeout(function(){
    isl.classList.add('closing-i'); isl.classList.remove('open');
    setTimeout(function(){ if (!isl.classList.contains('open')) isl.innerHTML = ''; }, 400);
  }, 150);
}

var unlocking = false;
function unlock(){
  if (unlocking) return; unlocking = true;
  var el = $('lockRoot'); el.style.transform = 'translateY(-105%)'; el.style.opacity = '0';
  setTimeout(function(){ unlocking = false; go('home'); S.fromLock = true; $('view').innerHTML = V.home(); startPushes(); }, 320);
}

var closing = false;
function goHome(){
  if (S.screen === 'lock' || S.screen === 'home' || closing) return;
  closing = true; S.alert = null; renderAlert();
  var v = $('view'), l = $('layer');
  v.style.animation = 'none'; l.style.animation = 'none';
  v.style.transformOrigin = S.origin; l.style.transformOrigin = S.originL;
  void v.offsetWidth;
  v.classList.add('closing'); l.classList.add('closing');
  setTimeout(function(){ closing = false; l.classList.remove('closing'); go('home'); }, 230);
}

/* ====== actions ====== */
var OPEN_APPS = ['wa','photos','phone'];
var A = {
  home: goHome,
  banner: function(el){
    if (el.dataset.swiped) return;
    var id = el.getAttribute('data-id'); hideBanner();
    var row = document.createElement('div'); row.setAttribute('data-id', id);
    S.origin = '50% 0%'; S.originL = '50% 6%';
    var wasApp = IN_APP(S.screen);
    if (!wasApp) { S.screen = 'home'; }
    A.chat(row);
  },
  unlock: unlock,
  torch: function(){ S.torch = !S.torch; render(); },
  lockNotif: function(){ S.alert = 'افتح الجوال أول — اسحب لفوق'; renderAlert(); },
  closeAlert: function(){ S.alert = null; renderAlert(); },
  soon: function(){ S.alert = 'هالخاصية تفتح يوم الجمعة البيضاء 😉'; renderAlert(); },
  open: function(el){
    var s = el.getAttribute('data-s');
    if (OPEN_APPS.indexOf(s) === -1) return A.soon();
    originFrom(el);
    go(s, s === 'files' ? { code:'', codeErr:false, face:'scan' } : s === 'wa' ? { waTab:'chats' } : null);
  },
  back: function(el){ go(el.getAttribute('data-s')); },
  archive: function(){ go('archive'); },
  waFilter: function(el){ S.waFilter = el.getAttribute('data-id'); var l = $('waList'); if (l) { l.innerHTML = waListHtml(); l.classList.add('quiet'); } document.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('on', c.getAttribute('data-id') === S.waFilter); }); },
  waTab: function(el){ var t = el.getAttribute('data-id'); if (t === S.waTab) return; S.waTab = t; S.anim = 'fade'; render(); },
  locked: function(){ S.alert = 'ما تقدر ترسل أو تعدّل من جوال غيرك 😅'; renderAlert(); },
  status: function(el){
    var c = chatById(el.getAttribute('data-id'));
    var text = { snap:'الليلة لايف… فيه مفاجأة 👀', billionaire:'Mars soon 🚀', khala:'صباح الخير 🌸' }[c.id] || '';
    var o = $('overlay'); o.hidden = false;
    o.innerHTML = '<button data-a="closeStatus" aria-label="إغلاق" style="position:absolute;inset:0;background:#0b0b0b;display:flex;flex-direction:column;animation:lpFade .2s ease-out backwards;text-align:center"><div style="margin:58px 12px 0;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden"><div style="height:100%;background:#fff;transform-origin:right;animation:lpBar 4s linear forwards"></div></div><div style="display:flex;align-items:center;gap:10px;padding:12px 14px">'+avatar(c,34)+'<span style="font-size:14px;font-weight:700">'+esc(c.name)+'</span></div><div style="flex:1;display:flex;align-items:center;justify-content:center;padding:30px;font-size:26px;font-weight:700;line-height:1.5">'+esc(text)+'</div></button>';
    clearTimeout(A._st); A._st = setTimeout(function(){ A.closeStatus(); }, 4000);
  },
  closeStatus: function(){ clearTimeout(A._st); var o = $('overlay'); if (!S.alert) { o.hidden = true; o.innerHTML = ''; } },
  camMode: function(el){ S.camMode = el.getAttribute('data-id'); S.anim = 'none'; render(); },
  shutter: function(){
    var vf = $('viewfinder'); if (!vf) return;
    var f = document.createElement('div'); f.style.cssText = 'position:absolute;inset:0;background:#fff;animation:lpFlash .35s ease-out forwards;pointer-events:none'; vf.appendChild(f);
    setTimeout(function(){ if (f.parentNode) f.parentNode.removeChild(f); }, 400);
    S.shots++; setTimeout(function(){ if (S.screen === 'camera') { S.anim = 'none'; render(); } }, 380);
  },
  camFlip: function(){ var ic = $('flipIc'); if (ic) { ic.style.animation = 'none'; void ic.offsetWidth; ic.style.animation = 'lpSpin .4s ease'; } var vf = $('viewfinder'); if (vf) { vf.style.transition = 'filter .2s'; vf.style.filter = 'blur(12px)'; setTimeout(function(){ vf.style.filter = 'none'; }, 260); } },
  camRoll: function(){ go('photos'); },
  chat: function(el){
    var id = el.getAttribute('data-id'), c = chatById(id);
    var first = !S.read[id]; S.read[id] = true;
    go('chat', { chatId:id, typing: !!(c.typing && first) });
    if (c.typing && first) setTimeout(function(){ if (S.screen === 'chat' && S.chatId === id) { S.typing = false; var sub = $('chatSub'); if (sub) { sub.textContent = c.sub; sub.style.color = 'rgba(235,235,245,.6)'; } var dl = document.querySelectorAll('.bub'); var last = dl[dl.length-1]; if (last && last.querySelector('span[style*="lpDot"]')) last.remove(); } }, 3200);
  },
  calls: function(el){ S.calls = el.getAttribute('data-id'); S.anim = 'none'; render(); },
  note: function(el){ go('note', { noteIdx: +el.getAttribute('data-id') }); },
  day: function(el){ S.day = +el.getAttribute('data-id'); S.anim = 'none'; render(); },
  photo: function(el){ go('photo', { photoIdx: +el.getAttribute('data-id') }); },
  secret: function(){
    if (S.solved) return go('reveal');
    go('face', { face:'scan' });
    setTimeout(function(){ if (S.screen === 'face') { S.face = 'fail'; S.anim = 'none'; render(); } }, 1100);
  },
  toPass: function(){ go('pass', { code:'', codeErr:false, shake:0 }); },
  key: function(el){
    if (S.code.length >= 4) return;
    S.code += el.getAttribute('data-id'); S.codeErr = false; S.shake = 0; S.anim = 'none'; render();
    if (S.code.length === 4) setTimeout(function(){
      if (S.code === CONFIG.passcode) { S.solved = true; try { localStorage.setItem('thnyan_lp_solved','1'); } catch(e){} go('reveal', { code:'' }); }
      else { S.code = ''; S.codeErr = true; S.shake = 1; S.anim = 'none'; render(); }
    }, 300);
  },
  passBack: function(){ if (S.code.length) { S.code = S.code.slice(0,-1); S.anim = 'none'; render(); } else go('files'); },
  share: function(){
    var data = { title:'جوال عبدالله', text:'لقيت جوال عبدالله وفتحت ملف «الجمعة» 👀 تقدر تفتحه؟', url: location.href };
    if (navigator.share) navigator.share(data).catch(function(){});
    else if (navigator.clipboard) navigator.clipboard.writeText(data.text + ' ' + data.url).then(function(){ S.alert = 'انسخ الرابط وأرسله لربعك ✓'; renderAlert(); });
  }
};

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-a]');
  if (!el || !$('screen').contains(el)) return;
  var fn = A[el.getAttribute('data-a')];
  if (fn) fn(el, e);
});
document.addEventListener('input', function(e){
  if (e.target && e.target.id === 'waSearch') { S.waQuery = e.target.value; var l = $('waList'); if (l) { l.innerHTML = waListHtml(); l.classList.add('quiet'); } }
});
document.addEventListener('keydown', function(e){
  if (S.screen === 'pass' && /^[0-9]$/.test(e.key)) { var b = document.querySelector('[data-a="key"][data-id="'+e.key+'"]'); if (b) A.key(b); }
  else if (S.screen === 'pass' && e.key === 'Backspace') A.passBack();
  else if (e.key === 'Escape') { if (S.alert) A.closeAlert(); else goHome(); }
});

/* ====== fit to window ====== */
function fit(){
  var k = Math.min(window.innerWidth / 440, window.innerHeight / 912, 1.15);
  $('device').style.transform = 'scale(' + k + ')';
}
window.addEventListener('resize', fit); fit();

/* ====== tick ====== */
setInterval(function(){
  var c = $('lockClock'); if (c) c.textContent = timeStr();
  if (S.screen !== 'lock') $('sbTime').textContent = timeStr();
  if (S.screen === 'reveal') { var cds = document.querySelectorAll('#cdRow .cd'); countdown().forEach(function(x,i){ if (cds[i]) cds[i].textContent = AR(x[0]); }); }
}, 15000);

render();
})();
</script>
</body>
